<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
  <title>Resonant</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: #fff; color: #111; }
    @media (prefers-color-scheme: dark) { body { background: #0f0f10; color: #eee; } .muted { color: #9a9a9f; } }
    main { text-align: center; padding: 24px; max-width: 420px; }
    .bars { display: inline-flex; gap: 6px; align-items: center; height: 44px; margin-bottom: 18px; }
    .bars i { width: 7px; border-radius: 4px; background: currentColor; animation: pulse 1.1s ease-in-out infinite; }
    .bars i:nth-child(1) { height: 16px; animation-delay: 0s; }
    .bars i:nth-child(2) { height: 30px; animation-delay: .12s; }
    .bars i:nth-child(3) { height: 44px; animation-delay: .24s; }
    .bars i:nth-child(4) { height: 22px; animation-delay: .36s; }
    @keyframes pulse { 50% { transform: scaleY(.45); opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .bars i { animation: none; } }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
    .muted { color: #6b6b70; margin: 0; }
  </style>
</head>
<body>
  <main>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>Starting Resonant</h1>
    <p class="muted">Loading the voice engine. The first start can take a little longer.</p>
  </main>
</body>
</html>
